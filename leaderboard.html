<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 模型排行榜 — AI 情报站</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/" class="site-logo">🤖 AI 情报站</a>
    <nav class="site-nav">
      <a href="/">🏠 首页</a>
      <a href="dashboard.html">📊 仪表盘</a>
      <a href="leaderboard.html" class="active">🏆 排行榜</a>
      <a href="timeline.html">📅 时间线</a>
      <a href="clusters.html">🗺️ 聚类</a>
      <a href="data/weekly/">📰 周报</a>
    </nav>
  </div>
</header>

<main class="container-wide" id="app">
  <div class="hero">
    <h1>🏆 AI 模型排行榜</h1>
    <p>从每日情报中自动提取模型 Benchmark 数据</p>
  </div>
  <div class="loading"><div class="spinner"></div><p>加载中...</p></div>
</main>

<footer class="site-footer">
  <p>自动提取 · <a href="https://ai.hjhai.xyz">ai.hjhai.xyz</a></p>
</footer>

<script>
function esc(s){if(!s)return"";const d=document.createElement("div");d.textContent=s;return d.innerHTML}

const BENCH_COLORS=['bench-c1','bench-c2','bench-c3','bench-c4'];

async function load(){
  try{
    const r=await fetch("data/leaderboard.json");
    if(!r.ok)throw r.status;
    render((await r.json()).models||[]);
  }catch(e){
    document.getElementById("app").innerHTML=`<div class="empty">📭 暂无模型数据<br><small>${e}</small></div>`;
  }
}

function render(models){
  if(!models.length){
    document.getElementById("app").innerHTML=`<div class="empty">📭 暂无模型数据<br><small>等待 LLM 从文章中提取模型信息</small></div>`;
    return;
  }

  let html=`<table>
    <thead><tr><th>模型</th><th>提供方</th><th>参数</th><th>上下文</th><th>Benchmark</th></tr></thead><tbody>`;

  for(const m of models){
    const bs=(m.benchmarks||[]).slice(0,5);
    const tags=bs.map((b,i)=>
      `<span class="bench-tag ${BENCH_COLORS[i%4]}">${esc(b.benchmark)}: ${esc(b.score)}</span>`
    ).join('');

    html+=`<tr>
      <td><strong style="color:var(--accent)">${esc(m.name)}</strong></td>
      <td style="color:var(--text-muted);font-size:.82rem">${esc(m.provider||'—')}</td>
      <td style="font-family:var(--font-mono);font-size:.82rem">${esc(m.parameters||'—')}</td>
      <td style="font-size:.82rem;color:var(--text-secondary)">${esc(m.context_window||'—')}</td>
      <td>${tags||'<span style="color:var(--text-muted);font-size:.78rem">暂无</span>'}</td>
    </tr>`;
  }

  html+=`</tbody></table>
    <p style="margin-top:1rem;font-size:.78rem;color:var(--text-muted);text-align:center">共 ${models.length} 个模型 · 自动提取 · <a href="dashboard.html">查看仪表盘</a></p>`;

  document.getElementById("app").innerHTML=html;
}

load();
</script>
</body>
</html>
