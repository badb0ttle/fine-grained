# AI 情报站智能助手 — Cloudflare Worker
name = "ai-intel-assistant"
main = "src/index.js"
compatibility_date = "2025-06-03"

# 部署后运行: npx wrangler kv namespace create AI_ASSISTANT_KV
# 把输出的 id 填入下面
[[kv_namespaces]]
binding = "AI_ASSISTANT_KV"
id = "YOUR_KV_NAMESPACE_ID"  # Run: npx wrangler kv namespace create AI_ASSISTANT_KV

[observability]
enabled = true
head_sampling_rate = 1
