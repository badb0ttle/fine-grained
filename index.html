<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 情报站 — 每日 AI 技术动态</title>
  <meta name="description" content="每日自动采集全球 AI 最新动态、论文、博客和技术讨论">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/" class="site-logo">🤖 AI 情报站</a>
    <nav class="site-nav">
      <a href="dashboard.html">📊 仪表盘</a>
      <a href="leaderboard.html">🏆 排行榜</a>
      <a href="data/weekly/">📰 周报</a>
      <a href="https://github.com/badb0ttle/fine-grained" target="_blank">GitHub</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="container">
    <h1>AI 情报站</h1>
    <p>每日全球 AI 技术动态 · 自动采集精选</p>
    <div class="hero-meta" id="meta-bar">
      <span>⏳ 加载中...</span>
    </div>
  </div>
</section>

<main class="container" id="main-content">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>正在加载最新情报...</p>
  </div>
</main>

<footer class="site-footer">
  <p>每日自动更新 · <a href="https://ai.hjhai.xyz">ai.hjhai.xyz</a></p>
  <p><a href="https://github.com/badb0ttle/fine-grained">GitHub</a></p>
</footer>

<script>
const CATS = {
  "AI Lab":     { icon:"🔬", name:"AI 实验室",      dot:"cat-lab" },
  "Paper":      { icon:"📄", name:"学术论文",        dot:"cat-paper" },
  "Community":  { icon:"🌐", name:"社区动态",        dot:"cat-community" },
  "Blog":       { icon:"📝", name:"技术博客",        dot:"cat-blog" },
  "Discussion": { icon:"💬", name:"技术讨论",        dot:"cat-discussion" },
  "中文媒体":    { icon:"🇨🇳", name:"中文媒体",       dot:"cat-discussion" },
};
const DEF = { icon:"📌", name:"其他", dot:"cat-lab" };

function esc(s){if(!s)return"";const d=document.createElement("div");d.textContent=s;return d.innerHTML}

function renderArticle(a){
  const title=a.title_cn||a.title;
  const summary=a.summary_cn||a.summary;
  const wim=a.why_it_matters?`<div class="article-why">💡 ${esc(a.why_it_matters)}</div>`:"";
  return `<div class="article-item">
    <div class="article-title"><a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(title)}</a></div>
    <div class="article-meta">
      <span class="source-name">${esc(a.source)}</span><span>·</span><span>${esc(a.published)}</span>
    </div>
    ${summary?`<div class="article-summary">${esc(summary.slice(0,280))}</div>`:""}
    ${wim}
  </div>`;
}

function render(data){
  const meta=document.getElementById("meta-bar");
  const main=document.getElementById("main-content");
  if(!data||!data.articles||!data.articles.length){
    main.innerHTML=`<div class="empty">📭 暂无数据，等待首次扫描完成...</div>`;
    meta.innerHTML=`<span>⏳ 等待首次采集</span>`;
    return;
  }
  const dt=data.scanned_at?data.scanned_at.slice(0,16):"";
  meta.innerHTML=`<span>📅 ${dt}</span><span>📡 ${data.successful_sources}/${data.total_sources} 源</span><span>📰 ${data.articles.length} 篇精选</span>`;

  const byCat={};
  for(const a of data.articles){
    const cat=a.category||"其他";
    if(!byCat[cat])byCat[cat]=[];
    byCat[cat].push(a);
  }

  const order=["AI Lab","Paper","中文媒体","Blog","Community","Discussion"];
  let html="";
  for(const cat of order){
    if(!byCat[cat])continue;
    const c=CATS[cat]||DEF;
    html+=`<section class="category-section">
      <div class="category-header">
        <span class="category-dot ${c.dot}"></span>
        <h2>${c.icon} ${c.name}</h2>
        <span class="count">${byCat[cat].length}</span>
      </div>`;
    for(const a of byCat[cat]) html+=renderArticle(a);
    html+=`</section>`;
    delete byCat[cat];
  }
  for(const[cat,items]of Object.entries(byCat)){
    const c=CATS[cat]||DEF;
    html+=`<section class="category-section">
      <div class="category-header"><span class="category-dot ${c.dot}"></span><h2>${c.icon} ${c.name}</h2><span class="count">${items.length}</span></div>`;
    for(const a of items) html+=renderArticle(a);
    html+=`</section>`;
  }
  main.innerHTML=html;
}

fetch("data/latest.json")
  .then(r=>r.ok?r.json():Promise.reject(r.status))
  .then(render)
  .catch(e=>{
    document.getElementById("loading").innerHTML=
      `<div class="empty">📭 暂无数据<br><small>${e}</small></div>`;
  });
</script>
</body>
</html>
