<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 情报站 — 每日 AI 技术动态</title>
  <meta name="description" content="每日自动采集全球 AI 最新动态、论文、博客和技术讨论">
  <link rel="stylesheet" href="assets/style.css">
  <!-- AI助手已暂时关闭 <link rel="stylesheet" href="assets/ai-assistant.css"> -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6C5CE7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/" class="site-logo">🤖 AI 情报站</a>
    <div class="search-bar" id="search-bar">
      <input type="text" id="search-input" placeholder="🔍 搜索文章..." autocomplete="off">
      <div class="search-results" id="search-results" style="display:none"></div>
    </div>
    <nav class="site-nav">
      <a href="dashboard.html">📊 仪表盘</a>
      <a href="leaderboard.html">🏆 排行榜</a>
      <a href="timeline.html">📅 时间线</a>
      <a href="clusters.html">🗺️ 聚类</a>
      <a href="data/weekly/">📰 周报</a>
      <a href="#trending">🔥 Trending</a>
      <a href="https://github.com/badb0ttle/fine-grained" target="_blank">GitHub</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="container">
    <h1>AI 情报站</h1>
    <p>每日全球 AI 技术动态 · 自动采集精选</p>
    <div class="hero-meta" id="meta-bar">
      <span>⏳ 加载中...</span>
    </div>
  </div>
</section>

<main class="container" id="main-content">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>正在加载最新情报...</p>
  </div>
</main>

<!-- GitHub Trending Section -->
<section class="container" id="trending" style="display:none">
  <div class="trending-header">
    <h2>🔥 GitHub Trending · AI/ML</h2>
    <span class="trending-date" id="trending-date"></span>
  </div>
  <div class="trending-grid" id="trending-grid"></div>
</section>

<footer class="site-footer">
  <p>每日自动更新 · <a href="https://ai.hjhai.xyz">ai.hjhai.xyz</a></p>
  <p><a href="https://github.com/badb0ttle/fine-grained">GitHub</a></p>
</footer>

<script>
const CATS = {
  "AI Lab":     { icon:"🔬", name:"AI 实验室",      dot:"cat-lab" },
  "Paper":      { icon:"📄", name:"学术论文",        dot:"cat-paper" },
  "Community":  { icon:"🌐", name:"社区动态",        dot:"cat-community" },
  "Blog":       { icon:"📝", name:"技术博客",        dot:"cat-blog" },
  "Discussion": { icon:"💬", name:"技术讨论",        dot:"cat-discussion" },
  "中文媒体":    { icon:"🇨🇳", name:"中文媒体",       dot:"cat-discussion" },
};
const DEF = { icon:"📌", name:"其他", dot:"cat-lab" };

function esc(s){if(!s)return"";const d=document.createElement("div");d.textContent=s;return d.innerHTML}

/* ── Reading History & Favorites (Phase 5) ── */
function getHistory(){try{return JSON.parse(localStorage.getItem('ai_read')||'[]')}catch(e){return[]}}
function getFavorites(){try{return JSON.parse(localStorage.getItem('ai_fav')||'[]')}catch(e){return[]}}
function markRead(link,title){
  var h=getHistory();
  h=h.filter(function(x){return x.link!==link});
  h.unshift({link:link,title:(title||'').slice(0,80),ts:Date.now()});
  if(h.length>50)h=h.slice(0,50);
  localStorage.setItem('ai_read',JSON.stringify(h));
}
function toggleFav(link,title){
  var f=getFavorites();
  var idx=f.findIndex(function(x){return x.link===link});
  if(idx>=0){f.splice(idx,1)}else{f.unshift({link:link,title:(title||'').slice(0,80),ts:Date.now()})}
  if(f.length>100)f=f.slice(0,100);
  localStorage.setItem('ai_fav',JSON.stringify(f));
  return idx<0;
}
function isRead(link){return getHistory().some(function(x){return x.link===link})}
function isFav(link){return getFavorites().some(function(x){return x.link===link})}
function articleLinkAttr(link,title){
  var t=esc(title||'').replace(/"/g,'&quot;');
  var l=esc(link||'').replace(/"/g,'&quot;');
  return 'href="'+l+'" target="_blank" rel="noopener" onclick="markRead(\''+l+'\',\''+t+'\')"';
}
function favBtnAttr(link,title){
  var t=esc(title||'').replace(/"/g,'&quot;');
  var l=esc(link||'').replace(/"/g,'&quot;');
  return 'onclick="event.preventDefault();event.stopPropagation();var b=this;var ok=toggleFav(\''+l+'\',\''+t+'\');b.textContent=ok?\'★\':\'☆\';var p=b.closest(\'.article-item\');if(ok)p.classList.add(\'fav\');else p.classList.remove(\'fav\');return false"';
}

function renderArticle(a){
  var title=a.title_cn||a.title;
  var summary=a.summary_cn||a.summary;
  var wim=a.why_it_matters?'<div class="article-why">💡 '+esc(a.why_it_matters)+'</div>':'';
  var read=isRead(a.link)?' read':'';
  var fav=isFav(a.link)?' fav':'';
  var favIcon=isFav(a.link)?'★':'☆';
  var askTitle=esc(title||'').replace(/'/g,"\\'");
  var askSummary=esc(summary||'').replace(/'/g,"\\'");
  var askSource=esc(a.source||'').replace(/'/g,"\\'");
  return '<div class="article-item'+read+fav+'">'+
    '<div class="article-title">'+
      '<a '+articleLinkAttr(a.link,title)+'>'+esc(title)+'</a>'+
      '<button class="fav-btn" '+favBtnAttr(a.link,title)+' title="收藏">'+favIcon+'</button>'+
      '<button class="article-ask-ai" onclick="event.preventDefault();event.stopPropagation();AIAssistant.openWithArticle(\''+askTitle+'\',\''+askSummary+'\',\''+askSource+'\')" title="问 AI">🤖 问 AI</button>'+
    '</div>'+
    '<div class="article-meta">'+
      '<span class="source-name">'+esc(a.source)+'</span><span>·</span><span>'+esc(a.published)+'</span>'+
    '</div>'+
    (summary?'<div class="article-summary">'+esc(summary.slice(0,280))+'</div>':'')+
    wim+
  '</div>';
}

function renderContinueReading(){
  var h=getHistory().slice(0,5);
  if(!h.length)return'';
  var items='';
  for(var i=0;i<h.length;i++){
    items+='<a href="'+esc(h[i].link)+'" target="_blank" rel="noopener" class="continue-item">'+esc(h[i].title)+'</a>';
  }
  return '<section class="continue-reading"><div class="continue-header">📖 继续阅读</div><div class="continue-list">'+items+'</div></section>';
}

function renderTrending(data){
  if(!data||!data.repos||!data.repos.length) return;
  const section = document.getElementById("trending");
  const grid = document.getElementById("trending-grid");
  const date = document.getElementById("trending-date");
  if(!section||!grid||!date) return;
  if(data.snapshot_at) date.textContent = "📅 " + data.snapshot_at.slice(0,10);

  let html = "";
  for(const r of data.repos.slice(0,12)){
    const owner = r.repo_full.split("/")[0];
    const name = r.repo_full.split("/")[1];
    const paperBadge = r.paper_linked
      ? `<span class="trending-badge paper-link" title="有对应论文">📄 论文</span>`
      : "";
    const langTag = r.language ? `<span class="trending-lang">${esc(r.language)}</span>` : "";
    html += `<a href="${esc(r.url)}" target="_blank" rel="noopener" class="trending-card">
      <div class="trending-repo">
        <span class="trending-owner">${esc(owner)}/</span><strong>${esc(name)}</strong>
      </div>
      <div class="trending-desc">${esc(r.description.slice(0,120))}</div>
      <div class="trending-meta">
        <span class="trending-stars">⭐ ${r.stars_today} today</span>
        <span class="trending-total">${r.total_stars.toLocaleString()} total</span>
        ${langTag}
        ${paperBadge}
      </div>
    </a>`;
  }
  grid.innerHTML = html;
  section.style.display = "block";
  if(location.hash === "#trending"){
    section.scrollIntoView();
  }
}

function render(data){
  const meta=document.getElementById("meta-bar");
  const main=document.getElementById("main-content");
  if(!data||!data.articles||!data.articles.length){
    main.innerHTML=`<div class="empty">📭 暂无数据，等待首次扫描完成...</div>`;
    meta.innerHTML=`<span>⏳ 等待首次采集</span>`;
    return;
  }
  const dt=data.scanned_at?data.scanned_at.slice(0,16):"";
  meta.innerHTML=`<span>📅 ${dt}</span><span>📡 ${data.successful_sources}/${data.total_sources} 源</span><span>📰 ${data.articles.length} 篇精选</span>`;

  const byCat={};
  for(const a of data.articles){
    const cat=a.category||"其他";
    if(!byCat[cat])byCat[cat]=[];
    byCat[cat].push(a);
  }

  const order=["AI Lab","Paper","中文媒体","Blog","Community","Discussion"];
  let html=renderContinueReading();
  for(const cat of order){
    if(!byCat[cat])continue;
    const c=CATS[cat]||DEF;
    html+=`<section class="category-section">
      <div class="category-header">
        <span class="category-dot ${c.dot}"></span>
        <h2>${c.icon} ${c.name}</h2>
        <span class="count">${byCat[cat].length}</span>
      </div>`;
    for(const a of byCat[cat]) html+=renderArticle(a);
    html+=`</section>`;
    delete byCat[cat];
  }
  for(const[cat,items]of Object.entries(byCat)){
    const c=CATS[cat]||DEF;
    html+=`<section class="category-section">
      <div class="category-header"><span class="category-dot ${c.dot}"></span><h2>${c.icon} ${c.name}</h2><span class="count">${items.length}</span></div>`;
    for(const a of items) html+=renderArticle(a);
    html+=`</section>`;
  }
  main.innerHTML=html;
}

fetch("data/latest.json")
  .then(r=>r.ok?r.json():Promise.reject(r.status))
  .then(render)
  .catch(e=>{
    document.getElementById("loading").innerHTML=
      `<div class="empty">📭 暂无数据<br><small>${e}</small></div>`;
  });

fetch("data/trending.json")
  .then(r=>r.ok?r.json():Promise.reject(r.status))
  .then(renderTrending)
  .catch(()=>{});

/* ── Search (Phase 5) ── */
let searchIndex = [];
let searchDebounce = 0;

fetch("data/search_index.json")
  .then(r=>r.json())
  .then(data=>{ searchIndex = data; })
  .catch(()=>{});

function highlightText(text, query) {
  if (!query || query.length < 2) return esc(text);
  const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return esc(text).replace(re, '<mark>$1</mark>');
}

function searchArticles(query) {
  if (!query || query.length < 2) return [];
  const q = query.toLowerCase();
  const results = [];
  for (const a of searchIndex) {
    let score = 0;
    const t = (a.title_cn || a.title || '').toLowerCase();
    const s = (a.summary_cn || a.summary || '').toLowerCase();
    const src = (a.source || '').toLowerCase();
    if (t.includes(q)) score += 10;
    if (t.startsWith(q)) score += 5;
    if (s.includes(q)) score += 3;
    if (src.includes(q)) score += 2;
    if (score > 0) results.push({ ...a, _score: score });
  }
  results.sort((a, b) => b._score - a._score);
  return results.slice(0, 12);
}

function renderSearchResults(results, query) {
  const panel = document.getElementById('search-results');
  if (!panel) return;
  if (!results.length) {
    panel.innerHTML = '<div class="search-empty">未找到相关文章</div>';
    panel.style.display = 'block';
    return;
  }
  panel.innerHTML = results.map(a => `
    <a href="${esc(a.link)}" target="_blank" rel="noopener" class="search-item">
      <div class="search-item-title">${highlightText(a.title_cn || a.title, query)}</div>
      <div class="search-item-meta">
        <span class="search-item-source">${esc(a.source)}</span>
        <span>·</span>
        <span>${esc((a.published||'').slice(0,10))}</span>
        ${a.category ? `<span class="search-item-cat">${esc(a.category)}</span>` : ''}
        ${a.is_paper ? '<span class="search-item-badge">📄 论文</span>' : ''}
      </div>
    </a>
  `).join('');
  panel.style.display = 'block';
}

document.getElementById('search-input').addEventListener('input', function() {
  clearTimeout(searchDebounce);
  const query = this.value.trim();
  searchDebounce = setTimeout(() => {
    const results = searchArticles(query);
    renderSearchResults(results, query);
  }, 200);
});

document.getElementById('search-input').addEventListener('focus', function() {
  const query = this.value.trim();
  if (query.length >= 2) {
    const results = searchArticles(query);
    renderSearchResults(results, query);
  }
});

document.addEventListener('click', function(e) {
  const bar = document.getElementById('search-bar');
  if (bar && !bar.contains(e.target)) {
    document.getElementById('search-results').style.display = 'none';
  }
});

document.getElementById('search-input').addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.getElementById('search-results').style.display = 'none';
    this.blur();
  }
});

/* ── PWA Service Worker (Phase 5) ── */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(function(){});
}
</script>

</body>
</html>
