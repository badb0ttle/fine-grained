# OpenResty (NGINX) reverse proxy for AllOfAI API
# Place at: /usr/local/openresty/nginx/conf/sites/ai-intel-api.conf

server {
    listen 80;
    server_name ai.hjhai.xyz;

    # ── WAF: Block common attack vectors ──
    location ~ \.(php|aspx|asp|jsp|cgi)$ {
        return 403;
    }

    # ── API proxy ──
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (cluster computation can be slow)
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;

        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;

        # CORS handled by FastAPI — don't double-add
        add_header Access-Control-Allow-Origin "https://ai.hjhai.xyz" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Idempotency-Key" always;
    }

    # ── Health check (internal only) ──
    location /health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://127.0.0.1:8001/health;
    }
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
