map $uri $cache_control {
    ~^/api/latest           "no-cache";
    ~^/api/stats            "no-cache";
    ~^/api/search           "no-store";
    ~^/api/trending         "no-cache";
    ~^/api/leaderboard      "no-cache";
    ~^/api/model-leaderboard "no-cache";
    ~^/api/clusters         "no-cache";
    ~^/api/weekly           "no-cache";
    ~^/api/admin/           "no-store";
    ~^/health               "no-store";
    default                 "no-cache";
}

server {
    listen 80;
    listen 443 ssl;
    server_name api.hjhai.xyz;

    ssl_certificate     /www/sites/api.hjhai.xyz/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/api.hjhai.xyz/ssl/privkey.pem;
    ssl_protocols       TLSv1.3 TLSv1.2;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!3DES:!MD5:!PSK;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    http2 on;

    client_max_body_size 10m;

    # ── Gzip compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 256;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        add_header Access-Control-Allow-Origin "https://ai.hjhai.xyz" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-Idempotency-Key, Authorization" always;
        add_header Cache-Control $cache_control always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
