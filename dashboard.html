<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仪表盘 — AI 情报站</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    canvas { max-height:260px; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/" class="site-logo">🤖 AI 情报站</a>
    <nav class="site-nav">
      <a href="/">🏠 首页</a>
      <a href="dashboard.html" class="active">📊 仪表盘</a>
      <a href="leaderboard.html">🏆 排行榜</a>
      <a href="timeline.html">📅 时间线</a>
      <a href="clusters.html">🗺️ 聚类</a>
      <a href="data/weekly/">📰 周报</a>
    </nav>
  </div>
</header>

<main class="container-wide" id="app">
  <div class="hero">
    <h1>📊 Pipeline 仪表盘</h1>
    <p id="hero-date" style="font-size:.85rem"></p>
  </div>
  <div class="loading"><div class="spinner"></div><p>加载中...</p></div>
</main>

<footer class="site-footer">
  <p><a href="https://ai.hjhai.xyz">ai.hjhai.xyz</a> · 自动生成</p>
</footer>

<script>
function esc(s){if(!s)return"";const d=document.createElement("div");d.textContent=s;return d.innerHTML}

async function load(){
  try{
    const r=await fetch("data/stats.json");
    if(!r.ok)throw r.status;
    render(await r.json());
  }catch(e){
    document.getElementById("app").innerHTML=`<div class="empty">📭 暂无仪表盘数据<br><small>${e}</small></div>`;
  }
}

function render(d){
  const tr=d.daily_trends||[];
  const sh=d.source_health||[];
  const healthy=sh.filter(s=>s.status==="healthy").length;
  document.getElementById("hero-date").textContent=`更新于 ${(d.generated_at||"").slice(0,16)}`;

  let html=`<div class="kpi-grid">
    <div class="kpi"><div class="kpi-value">${tr.length?tr[tr.length-1].total_articles:0}</div><div class="kpi-label">📰 总文章数</div></div>
    <div class="kpi"><div class="kpi-value">${healthy}/${sh.length}</div><div class="kpi-label">📡 信源健康</div></div>
    <div class="kpi"><div class="kpi-value">${d.score_distribution?.['80-100']||0}</div><div class="kpi-label">⭐ 高分 (80+)</div></div>
    <div class="kpi"><div class="kpi-value">${(d.category_distribution||{})['Paper']||0}</div><div class="kpi-label">📄 论文数</div></div>
  </div>`;

  html+=`<div class="dash-grid">`;

  // Daily trend chart
  if(tr.length>1){
    html+=`<div class="card card-full"><h2>📈 每日采集趋势</h2><canvas id="trendChart"></canvas></div>`;
  }

  // Source health
  html+=`<div class="card"><h2>📡 信源健康</h2><table>
    <tr><th>信源</th><th>状态</th><th>上次成功</th></tr>`;
  for(const s of sh){
    const cls=s.status==="healthy"?"badge-ok":s.status==="degraded"?"badge-warn":"badge-err";
    const last=s.last_success?s.last_success.slice(0,16):"—";
    html+=`<tr><td>${esc(s.name)} <span style="color:var(--text-muted);font-size:.75rem">${esc(s.category)}</span></td>
      <td><span class="badge ${cls}">${s.status}</span></td>
      <td style="font-size:.78rem;color:var(--text-muted)">${last}</td></tr>`;
  }
  html+=`</table></div>`;

  // Category chart
  const cats=d.category_distribution||{};
  if(Object.keys(cats).length){
    html+=`<div class="card"><h2>🏷️ 分类分布</h2><canvas id="catChart"></canvas></div>`;
  }

  // Top articles
  html+=`<div class="card"><h2>🏆 最高分文章</h2><table>
    <tr><th>文章</th><th>分数</th><th>来源</th></tr>`;
  for(const a of(d.top_articles||[])){
    html+=`<tr><td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.title)}</td>
      <td><span class="score-bar" style="width:${a.score}px"></span>${a.score}</td>
      <td style="font-size:.78rem;color:var(--text-muted)">${esc(a.source)}</td></tr>`;
  }
  html+=`</table></div></div>`; // close dash-grid

  // Keyword trends
  const trends=d.keyword_trends?.keywords||[];
  if(trends.length){
    const dirMap={surging:"🚀飙升",rising:"📈上升",falling:"📉下降",declining:"🔻下滑",stable:"➡️平稳"};
    html+=`<div class="card" style="margin-top:1.2rem"><h2>🔥 关键词趋势 (7 天)</h2><div class="trend-cloud">`;
    for(const t of trends.slice(0,18)){
      const opacity=Math.min(1,.3+Math.abs(t.change_pct)/100);
      html+=`<span class="trend-tag" style="opacity:${opacity}">${dirMap[t.direction]||t.direction}
        <strong>${esc(t.keyword)}</strong>
        <span style="color:${t.change_pct>0?'var(--green)':'var(--red)'};font-size:.75rem">${t.change_pct>0?'+':''}${t.change_pct}%</span></span>`;
    }
    html+=`</div></div>`;
  }

  document.getElementById("app").innerHTML=html;

  // Charts
  if(tr.length>1){
    new Chart(document.getElementById("trendChart"),{
      type:"line",
      data:{
        labels:tr.map(r=>r.date.slice(5)),
        datasets:[
          {label:"总文章",data:tr.map(r=>r.total_articles),borderColor:"#6C5CE7",tension:.3},
          {label:"新增",data:tr.map(r=>r.new_articles),borderColor:"#00b894",tension:.3},
          {label:"精选",data:tr.map(r=>r.curated_count),borderColor:"#f0a050",tension:.3},
        ]
      },
      options:{
        responsive:true,
        plugins:{legend:{labels:{color:"#9898b0"}}},
        scales:{
          x:{ticks:{color:"#686880"},grid:{color:"rgba(255,255,255,0.04)"}},
          y:{ticks:{color:"#686880"},grid:{color:"rgba(255,255,255,0.04)"},beginAtZero:true},
        }
      }
    });
  }

  if(Object.keys(cats).length){
    const colors={"AI Lab":"#6C5CE7","Paper":"#00b894","Community":"#74b9ff","Blog":"#f0a050","中文媒体":"#fd79a8","Discussion":"#e17055","其他":"#686880"};
    new Chart(document.getElementById("catChart"),{
      type:"doughnut",
      data:{
        labels:Object.keys(cats),
        datasets:[{data:Object.values(cats),backgroundColor:Object.keys(cats).map(c=>colors[c]||"#686880"),borderColor:"#0a0a12"}]
      },
      options:{
        responsive:true,
        plugins:{legend:{position:"bottom",labels:{color:"#9898b0",padding:16}}}
      }
    });
  }
}

load();
</script>
</body>
</html>
