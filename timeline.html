<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时间线 · AI 情报站</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <style>
    .tl-container { max-width: 800px; margin: 0 auto; padding: 0 1rem 3rem; }
    .tl-day { margin-bottom: 1.5rem; }
    .tl-day-header {
      display: flex; align-items: center; gap: .6rem;
      padding: .4rem 0 .5rem; position: sticky; top: 68px; z-index: 10;
      background: var(--bg-deep); border-bottom: 1px solid var(--border);
    }
    .tl-day-date {
      font-size: .9rem; font-weight: 600; color: var(--accent2);
      font-family: var(--font-mono);
    }
    .tl-day-count {
      font-size: .7rem; color: var(--text-muted);
      background: var(--bg-elevated); padding: 1px 8px; border-radius: 999px;
    }
    .tl-item {
      display: flex; align-items: baseline; gap: .6rem;
      padding: .45rem 0; border-bottom: 1px solid var(--border);
      transition: background var(--fast) var(--ease);
    }
    .tl-item:hover { background: var(--bg-hover); }
    .tl-item-time {
      font-size: .7rem; color: var(--text-muted); font-family: var(--font-mono);
      min-width: 42px; flex-shrink: 0;
    }
    .tl-item-cat {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 6px;
    }
    .tl-item-content { flex: 1; min-width: 0; }
    .tl-item-title {
      font-size: .85rem; font-weight: 500; line-height: 1.35;
    }
    .tl-item-title a { color: var(--text-primary); text-decoration: none; }
    .tl-item-title a:hover { color: var(--accent2); }
    .tl-item-meta {
      font-size: .7rem; color: var(--text-muted); margin-top: 1px;
      display: flex; gap: .6rem; flex-wrap: wrap;
    }
    .tl-item-source { color: var(--accent); }

    .cat-AI{background:var(--accent)}
    .cat-Paper{background:var(--green)}
    .cat-Blog{background:var(--orange)}
    .cat-Community{background:var(--blue)}
    .cat-中文媒体{background:var(--pink)}

    .tl-filters {
      display: flex; gap: .4rem; justify-content: center;
      padding: .8rem 0; flex-wrap: wrap;
    }
    .tl-filters button {
      padding: .25rem .65rem; border: 1px solid var(--border);
      border-radius: 999px; background: transparent; color: var(--text-secondary);
      font-size: .75rem; cursor: pointer; transition: all var(--fast) var(--ease);
      font-family: var(--font-body);
    }
    .tl-filters button:hover, .tl-filters button.active {
      border-color: var(--accent); color: var(--accent);
      background: rgba(108,92,231,0.08);
    }
    .tl-load-more {
      text-align: center; padding: 1.5rem;
    }
    .tl-load-more button {
      padding: .5rem 1.5rem; border: 1px solid var(--border-strong);
      border-radius: var(--radius); background: var(--bg-card);
      color: var(--text-secondary); font-size: .82rem; cursor: pointer;
      font-family: var(--font-body); transition: all var(--fast) var(--ease);
    }
    .tl-load-more button:hover { border-color: var(--accent); color: var(--accent); }
    .tl-empty { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/" class="site-logo">🤖 AI 情报站</a>
    <nav class="site-nav">
      <a href="/">🏠 首页</a>
      <a href="dashboard.html">📊 仪表盘</a>
      <a href="leaderboard.html">🏆 排行榜</a>
      <a href="timeline.html" class="active">📅 时间线</a>
      <a href="clusters.html">🗺️ 聚类</a>
      <a href="data/weekly/">📰 周报</a>
      <a href="https://github.com/badb0ttle/fine-grained" target="_blank">GitHub</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="container">
    <h1>📅 文章时间线</h1>
    <p>按天查看所有 AI 技术动态</p>
    <div class="tl-filters" id="filters">
      <button class="active" data-cat="all">全部</button>
      <button data-cat="AI Lab">AI 实验室</button>
      <button data-cat="Paper">学术论文</button>
      <button data-cat="Blog">技术博客</button>
      <button data-cat="Community">社区动态</button>
      <button data-cat="中文媒体">中文媒体</button>
    </div>
  </div>
</section>

<div class="tl-container" id="tl-container"></div>
<div class="tl-load-more" id="tl-load-more" style="display:none">
  <button onclick="loadMore()">加载更多...</button>
</div>

<footer class="site-footer">
  <p>每日自动更新 · <a href="https://ai.hjhai.xyz">ai.hjhai.xyz</a></p>
  <p><a href="https://github.com/badb0ttle/fine-grained">GitHub</a></p>
</footer>

<script>
function esc(s){if(!s)return"";const d=document.createElement("div");d.textContent=s;return d.innerHTML}

var allArticles = [];
var activeFilter = 'all';
var DAYS_PER_PAGE = 14;
var shownDays = 0;

fetch('data/search_index.json')
  .then(function(r){return r.json()})
  .then(function(data){
    allArticles = data;
    applyFilter();
  })
  .catch(function(e){
    document.getElementById('tl-container').innerHTML = '<div class="tl-empty">⚠️ 数据加载失败</div>';
  });

function getFiltered(){
  if (activeFilter === 'all') return allArticles;
  return allArticles.filter(function(a){return a.category === activeFilter});
}

function groupByDay(articles){
  var groups = {};
  for (var i=0; i<articles.length; i++){
    var a = articles[i];
    var d = new Date(a.published);
    if (isNaN(d.getTime())) continue;
    var key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if (!groups[key]) groups[key] = [];
    groups[key].push(a);
  }
  // Sort days descending
  var sorted = Object.keys(groups).sort().reverse();
  return {groups: groups, days: sorted};
}

function renderDays(days, groups, startIdx, count){
  var html = '';
  var end = Math.min(startIdx + count, days.length);
  for (var i = startIdx; i < end; i++){
    var day = days[i];
    var items = groups[day];
    items.sort(function(a,b){return b.score - a.score});

    var dayLabel = day.slice(5); // MM-DD
    html += '<div class="tl-day">'+
      '<div class="tl-day-header">'+
        '<span class="tl-day-date">📅 '+dayLabel+'</span>'+
        '<span class="tl-day-count">'+items.length+' 篇</span>'+
      '</div>';

    for (var j=0; j<items.length; j++){
      var a = items[j];
      var catClass = (a.category||'').replace(/\s+/g,'-') || 'AI';
      var title = a.title_cn || a.title || '';
      var time = (a.published||'').slice(11,16) || '';
      html += '<div class="tl-item">'+
        '<span class="tl-item-time">'+esc(time)+'</span>'+
        '<span class="tl-item-cat cat-'+esc(catClass)+'"></span>'+
        '<div class="tl-item-content">'+
          '<div class="tl-item-title"><a href="'+esc(a.link)+'" target="_blank" rel="noopener">'+esc(title)+'</a></div>'+
          '<div class="tl-item-meta">'+
            '<span class="tl-item-source">'+esc(a.source)+'</span>'+
            (a.is_paper ? '<span>📄 论文</span>' : '')+
          '</div>'+
        '</div>'+
      '</div>';
    }
    html += '</div>';
  }
  return html;
}

function applyFilter(){
  var filtered = getFiltered();
  var gg = groupByDay(filtered);
  shownDays = 0;

  // Update filter counts
  var btns = document.querySelectorAll('.tl-filters button');
  for (var i=0; i<btns.length; i++){
    var cat = btns[i].dataset.cat;
    var cnt = cat === 'all' ? allArticles.length : allArticles.filter(function(a){return a.category===cat}).length;
    btns[i].innerHTML = btns[i].textContent.replace(/\s*\(\d+\)$/,'') + ' ('+cnt+')';
  }

  if (gg.days.length === 0){
    document.getElementById('tl-container').innerHTML = '<div class="tl-empty">📭 该分类暂无文章</div>';
    document.getElementById('tl-load-more').style.display = 'none';
    return;
  }

  loadMoreDays(gg, true);
}

function loadMoreDays(gg, reset){
  if (!gg) {
    var filtered = getFiltered();
    gg = groupByDay(filtered);
  }
  var container = document.getElementById('tl-container');
  var moreBtn = document.getElementById('tl-load-more');

  if (reset) {
    container.innerHTML = '';
    shownDays = 0;
  }

  var html = renderDays(gg.days, gg.groups, shownDays, DAYS_PER_PAGE);
  container.insertAdjacentHTML('beforeend', html);
  shownDays += DAYS_PER_PAGE;

  if (shownDays >= gg.days.length) {
    moreBtn.style.display = 'none';
  } else {
    moreBtn.style.display = 'block';
    var remaining = gg.days.length - shownDays;
    moreBtn.querySelector('button').textContent = '加载更多... (' + remaining + ' 天剩余)';
  }
}

function loadMore(){
  var filtered = getFiltered();
  var gg = groupByDay(filtered);
  loadMoreDays(gg, false);
}

document.getElementById('filters').addEventListener('click', function(e){
  if (e.target.tagName === 'BUTTON'){
    document.querySelectorAll('.tl-filters button').forEach(function(b){b.classList.remove('active')});
    e.target.classList.add('active');
    activeFilter = e.target.dataset.cat;
    applyFilter();
  }
});
</script>
</body>
</html>
